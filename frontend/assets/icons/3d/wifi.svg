<svg viewBox="0 0 256 256" width="256" height="256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <filter id="shadow-main" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
    <filter id="shadow-soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <filter id="shadow-sharp" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="blur-ground" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <linearGradient id="wifi-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="wifi-cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  <ellipse cx="128" cy="226" rx="80" ry="14" fill="#0F172A" opacity="0.22" filter="url(#blur-ground)"/>
  
  <g filter="url(#shadow-main)">
    <!-- Wave 3 (Top Arch) -->
    <path d="M50,92 C96,48 160,48 206,92" fill="none" stroke="url(#wifi-cyan)" stroke-width="20" stroke-linecap="round" filter="url(#shadow-soft)"/>
    <path d="M54,90 C98,48 158,48 202,90" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
    
    <!-- Wave 2 (Middle Arch) -->
    <path d="M78,128 C108,98 148,98 178,128" fill="none" stroke="url(#wifi-blue)" stroke-width="20" stroke-linecap="round" filter="url(#shadow-soft)"/>
    <path d="M82,126 C110,98 146,98 174,126" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
    
    <!-- Wave 1 (Inner Arch) -->
    <path d="M106,164 C118,152 138,152 150,164" fill="none" stroke="url(#wifi-blue)" stroke-width="20" stroke-linecap="round" filter="url(#shadow-soft)"/>
    
    <!-- 3D Center Dot Sphere -->
    <circle cx="128" cy="204" r="18" fill="url(#wifi-blue)" filter="url(#shadow-main)"/>
    <ellipse cx="123" cy="199" rx="6" ry="3.5" fill="#FFFFFF" opacity="0.85"/>
  </g>
</svg>