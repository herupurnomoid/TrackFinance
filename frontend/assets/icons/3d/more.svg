<svg viewBox="0 0 256 256" width="256" height="256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <filter id="shadow-main" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
    <filter id="shadow-soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <filter id="shadow-sharp" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="blur-ground" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <linearGradient id="disc-base" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="disc-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <radialGradient id="sphere-blue" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="45%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </radialGradient>
    <radialGradient id="sphere-indigo" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="45%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </radialGradient>
    <radialGradient id="sphere-cyan" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="45%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </radialGradient>
  </defs>

  <ellipse cx="128" cy="226" rx="80" ry="14" fill="#0F172A" opacity="0.22" filter="url(#blur-ground)"/>

  <g filter="url(#shadow-main)">
    <!-- 3D Puffy Tactile Base Disc -->
    <ellipse cx="128" cy="138" rx="84" ry="58" fill="url(#disc-rim)"/>
    <ellipse cx="128" cy="132" rx="84" ry="58" fill="url(#disc-base)"/>
    <!-- Specular Highlight on Rim -->
    <ellipse cx="128" cy="80" rx="44" ry="12" fill="#FFFFFF" opacity="0.75"/>

    <!-- Three 3D Glossy Dots / Spheres Inside Disc -->
    <!-- Dot 1 (Left - Blue) -->
    <g filter="url(#shadow-soft)">
      <circle cx="86" cy="132" r="18" fill="url(#sphere-blue)"/>
      <ellipse cx="80" cy="126" rx="6" ry="3" fill="#FFFFFF" opacity="0.75"/>
    </g>

    <!-- Dot 2 (Center - Indigo, slightly larger) -->
    <g filter="url(#shadow-main)">
      <circle cx="128" cy="132" r="21" fill="url(#sphere-indigo)"/>
      <ellipse cx="121" cy="125" rx="7" ry="3.5" fill="#FFFFFF" opacity="0.8"/>
    </g>

    <!-- Dot 3 (Right - Cyan) -->
    <g filter="url(#shadow-soft)">
      <circle cx="170" cy="132" r="18" fill="url(#sphere-cyan)"/>
      <ellipse cx="164" cy="126" rx="6" ry="3" fill="#FFFFFF" opacity="0.75"/>
    </g>
  </g>
</svg>