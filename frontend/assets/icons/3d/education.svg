<svg viewBox="0 0 256 256" width="256" height="256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <filter id="shadow-main" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
    <filter id="shadow-soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <filter id="shadow-sharp" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="blur-ground" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <linearGradient id="cap-top" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="tassel-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="60%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>
    <linearGradient id="scroll-paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="50%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <linearGradient id="ribbon-red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
  </defs>

  <ellipse cx="128" cy="226" rx="88" ry="14" fill="#0F172A" opacity="0.22" filter="url(#blur-ground)"/>

  <g filter="url(#shadow-main)">
    <!-- Skull Cap Base under Mortarboard -->
    <path d="M88 106 C88 126 106 142 128 142 C150 142 168 126 168 106 Z" fill="#090D16"/>

    <!-- Diamond Mortarboard Top with 3D Bevel -->
    <!-- Extrusion thickness -->
    <polygon points="128,52 224,94 224,102 128,144 32,102 32,94" fill="#020617"/>
    <!-- Top Face -->
    <polygon points="128,50 224,92 128,134 32,92" fill="url(#cap-top)"/>

    <!-- Mortarboard Highlight -->
    <polygon points="128,50 176,71 128,92 80,71" fill="#FFFFFF" opacity="0.15"/>

    <!-- Center Button -->
    <ellipse cx="128" cy="92" rx="8" ry="5" fill="url(#tassel-gold)"/>

    <!-- Dangling Golden Silk Tassel -->
    <path d="M128 92 C150 96 172 108 178 124 L178 162" fill="none" stroke="url(#tassel-gold)" stroke-width="4" stroke-linecap="round"/>
    <!-- Tassel Fringe -->
    <polygon points="174,160 182,160 185,182 171,182" fill="url(#tassel-gold)" filter="url(#shadow-sharp)"/>

    <!-- Rolled Diploma Certificate Scroll in Front -->
    <g filter="url(#shadow-main)" transform="rotate(12 120 180)">
      <!-- Scroll Cylinder -->
      <rect x="68" y="166" width="124" height="28" rx="8" fill="url(#scroll-paper)"/>
      <!-- Rolled edge left -->
      <ellipse cx="68" cy="180" rx="6" ry="14" fill="#FDE68A"/>
      <!-- Ribbon tied around scroll -->
      <rect x="122" y="164" width="16" height="32" rx="4" fill="url(#ribbon-red)"/>
      <!-- Ribbon Bow tails -->
      <path d="M130 180 L142 200 L136 202 L128 184 Z" fill="url(#ribbon-red)"/>
      <path d="M130 180 L118 200 L124 202 L132 184 Z" fill="url(#ribbon-red)"/>
    </g>
  </g>
</svg>
