<svg viewBox="0 0 256 256" width="256" height="256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <filter id="shadow-main" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
    <filter id="shadow-soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <filter id="shadow-sharp" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="blur-ground" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <linearGradient id="pig-pink" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>
    <linearGradient id="snout-pink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBCFE8"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
  </defs>

  <ellipse cx="128" cy="226" rx="88" ry="14" fill="#0F172A" opacity="0.22" filter="url(#blur-ground)"/>

  <g filter="url(#shadow-main)">
    <!-- Golden Coin Dropping into Top Slot -->
    <g filter="url(#shadow-main)">
      <ellipse cx="128" cy="62" rx="26" ry="14" fill="#A16207"/>
      <ellipse cx="128" cy="58" rx="24" ry="12" fill="#FDE047"/>
      <text x="124" y="63" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#854D0E">$</text>
    </g>

    <!-- Coin Slot on Piggy Back -->
    <ellipse cx="128" cy="88" rx="20" ry="5" fill="#831843"/>

    <!-- Chubby Piggy Body -->
    <ellipse cx="128" cy="148" rx="76" ry="58" fill="url(#pig-pink)"/>

    <!-- Stubby Legs -->
    <rect x="76" y="184" width="22" height="26" rx="10" fill="#9D174D"/>
    <rect x="158" y="184" width="22" height="26" rx="10" fill="#9D174D"/>

    <!-- Floppy Ears -->
    <path d="M78 108 C68 84 88 80 96 94 Z" fill="url(#pig-pink)"/>
    <path d="M178 108 C188 84 168 80 160 94 Z" fill="url(#pig-pink)"/>

    <!-- Curly Tail (Back Left) -->
    <path d="M52 148 C42 142 42 130 50 132 C56 134 50 144 54 146" fill="none" stroke="#EC4899" stroke-width="6" stroke-linecap="round"/>

    <!-- Piggy Snout -->
    <ellipse cx="128" cy="156" rx="26" ry="18" fill="url(#snout-pink)" filter="url(#shadow-sharp)"/>
    <!-- Nostrils -->
    <ellipse cx="120" cy="156" rx="4" ry="6" fill="#9D174D"/>
    <ellipse cx="136" cy="156" rx="4" ry="6" fill="#9D174D"/>

    <!-- Cute Eyes -->
    <circle cx="104" cy="126" r="6" fill="#1E293B"/>
    <circle cx="102" cy="124" r="2" fill="#FFFFFF"/>
    <circle cx="152" cy="126" r="6" fill="#1E293B"/>
    <circle cx="150" cy="124" r="2" fill="#FFFFFF"/>

    <!-- Glossy Highlight on Cheek -->
    <ellipse cx="94" cy="144" rx="14" ry="8" fill="#FFFFFF" opacity="0.4" transform="rotate(-15 94 144)"/>
  </g>
</svg>
