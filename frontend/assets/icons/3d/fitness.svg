<svg viewBox="0 0 256 256" width="256" height="256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <filter id="shadow-main" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
    <filter id="shadow-soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <filter id="shadow-sharp" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="blur-ground" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <linearGradient id="plate-grad" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="plate-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#082F49"/>
    </linearGradient>
    <linearGradient id="bar-metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>
  <ellipse cx="128" cy="226" rx="88" ry="14" fill="#0F172A" opacity="0.22" filter="url(#blur-ground)"/>
  <g filter="url(#shadow-main)" transform="rotate(-25 128 128)">
    <!-- Central Bar -->
    <rect x="64" y="118" width="128" height="20" rx="8" fill="url(#bar-metal)"/>
    <!-- Grip Knurling -->
    <rect x="104" y="116" width="48" height="24" rx="4" fill="#334155"/>
    <line x1="116" y1="116" x2="116" y2="140" stroke="#64748B" stroke-width="2"/>
    <line x1="128" y1="116" x2="128" y2="140" stroke="#64748B" stroke-width="2"/>
    <line x1="140" y1="116" x2="140" y2="140" stroke="#64748B" stroke-width="2"/>

    <!-- Left Outer Plate -->
    <ellipse cx="64" cy="128" rx="16" ry="52" fill="url(#plate-dark)"/>
    <ellipse cx="60" cy="128" rx="16" ry="52" fill="url(#plate-grad)"/>
    <ellipse cx="60" cy="128" rx="10" ry="34" fill="url(#plate-dark)"/>

    <!-- Left Inner Plate -->
    <ellipse cx="82" cy="128" rx="14" ry="44" fill="url(#plate-dark)"/>
    <ellipse cx="78" cy="128" rx="14" ry="44" fill="url(#plate-grad)"/>

    <!-- Right Inner Plate -->
    <ellipse cx="174" cy="128" rx="14" ry="44" fill="url(#plate-dark)"/>
    <ellipse cx="178" cy="128" rx="14" ry="44" fill="url(#plate-grad)"/>

    <!-- Right Outer Plate -->
    <ellipse cx="192" cy="128" rx="16" ry="52" fill="url(#plate-dark)"/>
    <ellipse cx="196" cy="128" rx="16" ry="52" fill="url(#plate-grad)"/>
    <ellipse cx="196" cy="128" rx="10" ry="34" fill="url(#plate-dark)"/>

    <!-- Collar Clips -->
    <rect x="94" y="114" width="8" height="28" rx="3" fill="url(#bar-metal)"/>
    <rect x="154" y="114" width="8" height="28" rx="3" fill="url(#bar-metal)"/>
  </g>
</svg>