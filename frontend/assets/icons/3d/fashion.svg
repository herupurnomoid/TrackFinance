<svg viewBox="0 0 256 256" width="256" height="256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <filter id="shadow-main" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
    <filter id="shadow-soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <filter id="shadow-sharp" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="blur-ground" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <linearGradient id="hoodie-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>
    <linearGradient id="hanger-wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <ellipse cx="128" cy="226" rx="78" ry="14" fill="#0F172A" opacity="0.22" filter="url(#blur-ground)"/>
  
  <g filter="url(#shadow-main)">
    <!-- Wooden Hanger Hook -->
    <path d="M128,42 C120,42 116,50 118,58 C120,64 126,66 128,72 L128,84" fill="none" stroke="#D97706" stroke-width="6" stroke-linecap="round"/>
    
    <!-- 3D Puffy T-Shirt / Hoodie -->
    <path d="M96,86 L70,116 L44,104 L60,154 L84,142 L84,214 L172,214 L172,142 L196,154 L212,104 L186,116 L160,86 C150,96 138,102 128,102 C118,102 106,96 96,86 Z" fill="url(#hoodie-grad)" filter="url(#shadow-soft)"/>
    
    <!-- Collar & Chest Highlights -->
    <path d="M96,86 C106,96 118,102 128,102 C138,102 150,96 160,86" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.8"/>
    <ellipse cx="128" cy="144" rx="24" ry="8" fill="#FFFFFF" opacity="0.2"/>
    
    <!-- Stylish Pocket Badge -->
    <rect x="136" y="130" width="22" height="26" rx="4" fill="#9D174D" opacity="0.8"/>
    <line x1="136" y1="136" x2="158" y2="136" stroke="#FBCFE8" stroke-width="2"/>
  </g>
</svg>