<svg viewBox="0 0 256 256" width="256" height="256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <filter id="shadow-main" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
    <filter id="shadow-soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <filter id="shadow-sharp" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="blur-ground" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <linearGradient id="chrome-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#CBD5E1"/>
      <stop offset="70%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="gear-gold" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>
  </defs>
  <ellipse cx="128" cy="226" rx="80" ry="14" fill="#0F172A" opacity="0.22" filter="url(#blur-ground)"/>
  
  <g filter="url(#shadow-main)">
    <!-- 3D Gear Cog in Background -->
    <g transform="translate(142, 92)">
      <circle cx="0" cy="0" r="44" fill="url(#gear-gold)" filter="url(#shadow-soft)"/>
      <!-- Teeth -->
      <rect x="-8" y="-56" width="16" height="20" rx="4" fill="url(#gear-gold)"/>
      <rect x="-8" y="36" width="16" height="20" rx="4" fill="url(#gear-gold)"/>
      <rect x="-56" y="-8" width="20" height="16" rx="4" fill="url(#gear-gold)"/>
      <rect x="36" y="-8" width="20" height="16" rx="4" fill="url(#gear-gold)"/>
      <circle cx="0" cy="0" r="16" fill="#F8FAFC"/>
    </g>
    
    <!-- 3D Chrome Wrench in Foreground -->
    <g transform="rotate(-35 128 128)" filter="url(#shadow-main)">
      <!-- Wrench Handle -->
      <rect x="114" y="56" width="28" height="144" rx="14" fill="url(#chrome-grad)"/>
      <!-- Top Open Jaw -->
      <path d="M102,68 C96,44 112,24 128,24 C144,24 160,44 154,68 L142,68 L142,48 L114,48 L114,68 Z" fill="url(#chrome-grad)"/>
      <!-- Bottom Closed Ring -->
      <circle cx="128" cy="196" r="24" fill="url(#chrome-grad)"/>
      <circle cx="128" cy="196" r="12" fill="#F8FAFC"/>
      <!-- Specular Highlight Strip -->
      <line x1="122" y1="74" x2="122" y2="176" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    </g>
  </g>
</svg>