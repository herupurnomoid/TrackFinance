<svg viewBox="0 0 256 256" width="256" height="256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <filter id="shadow-main" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
    <filter id="shadow-soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <filter id="shadow-sharp" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="blur-ground" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <linearGradient id="meter-body" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="bolt-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="30%" stop-color="#FCD34D"/>
      <stop offset="80%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="screen-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
  </defs>
  <ellipse cx="128" cy="226" rx="80" ry="14" fill="#0F172A" opacity="0.22" filter="url(#blur-ground)"/>
  <g filter="url(#shadow-main)">
    <!-- Main Meter Box -->
    <rect x="52" y="58" width="152" height="156" rx="36" fill="url(#meter-body)"/>
    <ellipse cx="128" cy="62" rx="60" ry="10" fill="#A7F3D0" opacity="0.6"/>
    
    <!-- LCD Screen -->
    <rect x="76" y="80" width="104" height="42" rx="10" fill="url(#screen-glow)" filter="url(#shadow-sharp)"/>
    <text x="90" y="108" font-family="monospace" font-size="18" font-weight="bold" fill="#6EE7B7">220.4V</text>
    
    <!-- 3D Lightning Bolt Symbol in Front -->
    <g filter="url(#shadow-soft)">
      <polygon points="138,124 104,166 126,166 114,204 154,154 132,154" fill="url(#bolt-gold)"/>
      <polygon points="138,124 122,154 128,154 116,204 124,166 104,166" fill="#FFFFFF" opacity="0.5"/>
    </g>
    
    <!-- Small Keypad Dots -->
    <circle cx="84" cy="184" r="6" fill="#065F46"/>
    <circle cx="102" cy="184" r="6" fill="#065F46"/>
    <circle cx="154" cy="184" r="6" fill="#065F46"/>
    <circle cx="172" cy="184" r="6" fill="#EF4444"/>
  </g>
</svg>