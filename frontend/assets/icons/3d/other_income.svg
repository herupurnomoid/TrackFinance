<svg viewBox="0 0 256 256" width="256" height="256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <filter id="shadow-main" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
    <filter id="shadow-soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <filter id="shadow-sharp" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="blur-ground" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <linearGradient id="pouch-gold" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>
    <linearGradient id="pouch-ruffle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="cord-red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#9F1239"/>
    </linearGradient>
  </defs>

  <ellipse cx="128" cy="226" rx="82" ry="14" fill="#0F172A" opacity="0.22" filter="url(#blur-ground)"/>

  <g filter="url(#shadow-main)">
    <!-- Overflowing Gold Coins at Top Opening -->
    <ellipse cx="112" cy="92" rx="16" ry="8" fill="#FDE047" filter="url(#shadow-sharp)"/>
    <ellipse cx="144" cy="88" rx="16" ry="8" fill="#FDE047" filter="url(#shadow-sharp)"/>
    <circle cx="128" cy="78" r="14" fill="#FEF08A" filter="url(#shadow-soft)"/>
    <text x="124" y="83" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#854D0E">Rp</text>

    <!-- Top Ruffle of Pouch -->
    <path d="M88 96 C88 84 104 88 116 84 C128 80 144 88 156 84 C168 88 168 96 168 102 L88 102 Z" fill="url(#pouch-ruffle)"/>

    <!-- Braided Red Tie Cord with Tassels -->
    <rect x="84" y="102" width="88" height="10" rx="5" fill="url(#cord-red)"/>
    <!-- Hanging cord loops -->
    <path d="M128 112 C120 126 112 136 114 148" fill="none" stroke="url(#cord-red)" stroke-width="4" stroke-linecap="round"/>
    <path d="M128 112 C136 126 144 136 142 148" fill="none" stroke="url(#cord-red)" stroke-width="4" stroke-linecap="round"/>
    <!-- Tassel ends -->
    <circle cx="114" cy="150" r="5" fill="#FDE047"/>
    <circle cx="142" cy="150" r="5" fill="#FDE047"/>

    <!-- Puffy Golden Money Bag Belly -->
    <path d="M86 108 C62 126 54 164 64 190 C76 218 180 218 192 190 C202 164 194 126 170 108 Z" fill="url(#pouch-gold)"/>

    <!-- Specular Highlight on Belly -->
    <ellipse cx="106" cy="154" rx="28" ry="16" fill="#FFFFFF" opacity="0.38" transform="rotate(-30 106 154)"/>

    <!-- Embossed Golden Prosperity Emblem -->
    <circle cx="128" cy="164" r="18" fill="#CA8A04"/>
    <circle cx="128" cy="164" r="15" fill="url(#pouch-ruffle)"/>
    <text x="123" y="170" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#854D0E">Rp</text>
  </g>
</svg>
