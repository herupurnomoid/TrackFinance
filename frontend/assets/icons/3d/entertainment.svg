<svg viewBox="0 0 256 256" width="256" height="256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <filter id="shadow-main" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
    <filter id="shadow-soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <filter id="shadow-sharp" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="blur-ground" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <linearGradient id="pad-body" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="50%" stop-color="#7E22CE"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="pad-grip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6B21A8"/>
      <stop offset="100%" stop-color="#3B0764"/>
    </linearGradient>
    <linearGradient id="btn-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/><stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="btn-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ADE80"/><stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="btn-red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FB7185"/><stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="btn-yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047"/><stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
  </defs>

  <ellipse cx="128" cy="226" rx="88" ry="14" fill="#0F172A" opacity="0.22" filter="url(#blur-ground)"/>

  <g filter="url(#shadow-main)">
    <!-- Gamepad Body -->
    <path d="M72 82 C92 82 108 94 128 94 C148 94 164 82 184 82 C214 82 228 108 222 154 L212 192 C206 208 186 210 174 196 L154 172 C146 164 138 164 128 164 C118 164 110 164 102 172 L82 196 C70 210 50 208 44 192 L34 154 C28 108 42 82 72 82 Z" fill="url(#pad-body)"/>

    <!-- Left Grip Shadow -->
    <path d="M44 154 L52 190 C56 200 68 202 76 192 L94 170 C84 154 58 144 44 154 Z" fill="url(#pad-grip)" opacity="0.4"/>
    <!-- Right Grip Shadow -->
    <path d="M212 154 L204 190 C200 200 188 202 180 192 L162 170 C172 154 198 144 212 154 Z" fill="url(#pad-grip)" opacity="0.4"/>

    <!-- Specular Highlight Curve on Top Shell -->
    <path d="M76 90 C100 90 114 102 128 102 C142 102 156 90 180 90 C194 90 206 98 210 114 C190 102 162 108 128 108 C94 108 66 102 46 114 C50 98 62 90 76 90 Z" fill="#FFFFFF" opacity="0.35"/>

    <!-- D-PAD (Left) -->
    <g filter="url(#shadow-sharp)">
      <!-- Cross Base -->
      <rect x="74" y="112" width="16" height="42" rx="4" fill="#334155"/>
      <rect x="61" y="125" width="42" height="16" rx="4" fill="#334155"/>
      <circle cx="82" cy="133" r="5" fill="#1E293B"/>
    </g>

    <!-- Twin Analog Thumbsticks -->
    <g filter="url(#shadow-sharp)">
      <!-- Left Stick -->
      <circle cx="106" cy="154" r="16" fill="#1E293B"/>
      <circle cx="106" cy="154" r="12" fill="#475569"/>
      <circle cx="104" cy="152" r="4" fill="#94A3B8"/>
      <!-- Right Stick -->
      <circle cx="150" cy="154" r="16" fill="#1E293B"/>
      <circle cx="150" cy="154" r="12" fill="#475569"/>
      <circle cx="148" cy="152" r="4" fill="#94A3B8"/>
    </g>

    <!-- 4 Colorful Action Buttons (Right) -->
    <g filter="url(#shadow-sharp)">
      <!-- Top (Yellow) -->
      <circle cx="174" cy="116" r="8" fill="url(#btn-yellow)"/>
      <ellipse cx="173" cy="114" rx="3" ry="1.5" fill="#FFFFFF" opacity="0.6"/>
      <!-- Left (Blue) -->
      <circle cx="158" cy="132" r="8" fill="url(#btn-blue)"/>
      <ellipse cx="157" cy="130" rx="3" ry="1.5" fill="#FFFFFF" opacity="0.6"/>
      <!-- Right (Red) -->
      <circle cx="190" cy="132" r="8" fill="url(#btn-red)"/>
      <ellipse cx="189" cy="130" rx="3" ry="1.5" fill="#FFFFFF" opacity="0.6"/>
      <!-- Bottom (Green) -->
      <circle cx="174" cy="148" r="8" fill="url(#btn-green)"/>
      <ellipse cx="173" cy="146" rx="3" ry="1.5" fill="#FFFFFF" opacity="0.6"/>
    </g>
  </g>
</svg>
