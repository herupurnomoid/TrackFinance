<svg viewBox="0 0 256 256" width="256" height="256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <filter id="shadow-main" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
    <filter id="shadow-soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <filter id="shadow-sharp" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="blur-ground" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <linearGradient id="arrow-green-grad" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="35%" stop-color="#22C55E"/>
      <stop offset="75%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#14532D"/>
    </linearGradient>
    <linearGradient id="arrow-green-bevel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#86EFAC"/>
      <stop offset="50%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="specular-line" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="glow-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ADE80" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#16A34A" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Ground contact shadow -->
  <ellipse cx="128" cy="226" rx="74" ry="14" fill="#0F172A" opacity="0.25" filter="url(#blur-ground)"/>

  <!-- Subtle ambient glow circle -->
  <circle cx="128" cy="122" r="88" fill="url(#glow-ring)"/>

  <!-- 3D Upward Arrow Geometry -->
  <g filter="url(#shadow-main)">
    <!-- 3D Depth / Extrusion Shadow Layer -->
    <path d="M 128 36 L 208 116 L 164 116 L 164 212 L 92 212 L 92 116 L 48 116 Z" fill="#0F381E" transform="translate(0, 8)"/>

    <!-- Main Front Face (Panah Naik) -->
    <path d="M 128 32 L 208 112 L 162 112 L 162 208 L 94 208 L 94 112 L 48 112 Z" fill="url(#arrow-green-grad)"/>

    <!-- Top Left Bevel Edge Highlight -->
    <path d="M 128 32 L 48 112 L 62 112 L 128 46 L 194 112 L 208 112 Z" fill="url(#arrow-green-bevel)" opacity="0.75"/>

    <!-- Specular Highlight Line down center & crest -->
    <path d="M 128 38 L 128 202" stroke="url(#specular-line)" stroke-width="4.5" stroke-linecap="round" opacity="0.45"/>
    <path d="M 128 36 L 56 108" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

    <!-- Subtle White Shimmer Dots -->
    <circle cx="128" cy="46" r="4" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="128" cy="74" r="3" fill="#FFFFFF" opacity="0.6"/>
  </g>
</svg>