<svg viewBox="0 0 256 256" width="256" height="256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <filter id="shadow-main" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
    <filter id="shadow-soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <filter id="shadow-sharp" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="blur-ground" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <linearGradient id="paw-amber" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="paw-pink" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
  </defs>
  <ellipse cx="128" cy="226" rx="78" ry="14" fill="#0F172A" opacity="0.22" filter="url(#blur-ground)"/>
  <g filter="url(#shadow-main)">
    <!-- Main Center Paw Pad -->
    <path d="M128 140 C100 140 82 164 88 190 C92 208 110 214 128 214 C146 214 164 208 168 190 C174 164 156 140 128 140 Z" fill="url(#paw-amber)"/>
    <ellipse cx="118" cy="164" rx="20" ry="12" fill="#FFFFFF" opacity="0.3" transform="rotate(-20 118 164)"/>

    <!-- Inner Pad Heart Accent -->
    <path d="M128 170 C122 162 110 166 116 176 L128 186 L140 176 C146 166 134 162 128 170 Z" fill="url(#paw-pink)"/>

    <!-- 4 Toe Pads -->
    <!-- Toe 1 (Far Left) -->
    <g filter="url(#shadow-soft)">
      <ellipse cx="72" cy="128" rx="16" ry="24" fill="url(#paw-amber)" transform="rotate(-30 72 128)"/>
      <ellipse cx="70" cy="120" rx="8" ry="12" fill="#FFFFFF" opacity="0.3" transform="rotate(-30 70 120)"/>
    </g>

    <!-- Toe 2 (Center Left) -->
    <g filter="url(#shadow-soft)">
      <ellipse cx="108" cy="100" rx="18" ry="26" fill="url(#paw-amber)" transform="rotate(-10 108 100)"/>
      <ellipse cx="106" cy="92" rx="9" ry="13" fill="#FFFFFF" opacity="0.3" transform="rotate(-10 106 92)"/>
    </g>

    <!-- Toe 3 (Center Right) -->
    <g filter="url(#shadow-soft)">
      <ellipse cx="148" cy="100" rx="18" ry="26" fill="url(#paw-amber)" transform="rotate(10 148 100)"/>
      <ellipse cx="146" cy="92" rx="9" ry="13" fill="#FFFFFF" opacity="0.3" transform="rotate(10 146 92)"/>
    </g>

    <!-- Toe 4 (Far Right) -->
    <g filter="url(#shadow-soft)">
      <ellipse cx="184" cy="128" rx="16" ry="24" fill="url(#paw-amber)" transform="rotate(30 184 128)"/>
      <ellipse cx="182" cy="120" rx="8" ry="12" fill="#FFFFFF" opacity="0.3" transform="rotate(30 182 120)"/>
    </g>
  </g>
</svg>