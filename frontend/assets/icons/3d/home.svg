<svg viewBox="0 0 256 256" width="256" height="256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <filter id="shadow-main" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
    <filter id="shadow-soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <filter id="shadow-sharp" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="blur-ground" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <linearGradient id="roof-orange" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="50%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#9A3412"/>
    </linearGradient>
    <linearGradient id="wall-cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="door-wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
  </defs>

  <ellipse cx="128" cy="226" rx="88" ry="14" fill="#0F172A" opacity="0.22" filter="url(#blur-ground)"/>

  <g filter="url(#shadow-main)">
    <!-- Chimney -->
    <rect x="160" y="64" width="24" height="42" rx="4" fill="#9A3412"/>
    <rect x="156" y="60" width="32" height="8" rx="3" fill="#7C2D12"/>

    <!-- House Walls -->
    <rect x="66" y="120" width="124" height="92" rx="14" fill="url(#wall-cream)"/>

    <!-- Attic Window -->
    <circle cx="128" cy="104" r="14" fill="#38BDF8"/>
    <line x1="128" y1="90" x2="128" y2="118" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="114" y1="104" x2="142" y2="104" stroke="#FFFFFF" stroke-width="2"/>

    <!-- 3D Pitched Terracotta Roof -->
    <polygon points="128,52 214,124 198,132 128,74 58,132 42,124" fill="#7C2D12"/>
    <polygon points="128,52 214,124 42,124" fill="url(#roof-orange)"/>
    <!-- Roof highlight -->
    <polygon points="128,54 134,58 64,120 54,116" fill="#FFFFFF" opacity="0.4"/>

    <!-- Front Door -->
    <rect x="108" y="148" width="40" height="64" rx="6" fill="url(#door-wood)"/>
    <circle cx="140" cy="180" r="3" fill="#FDE047"/>

    <!-- Small Window beside door -->
    <rect x="76" y="148" width="24" height="28" rx="4" fill="#38BDF8"/>
    <line x1="88" y1="148" x2="88" y2="176" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="76" y1="162" x2="100" y2="162" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Shiny Golden Coin by the Porch Steps -->
    <ellipse cx="172" cy="198" rx="20" ry="12" fill="#EAB308" filter="url(#shadow-sharp)"/>
    <ellipse cx="172" cy="195" rx="16" ry="9" fill="#FDE047"/>
  </g>
</svg>
