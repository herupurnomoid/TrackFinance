<svg viewBox="0 0 256 256" width="256" height="256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <filter id="shadow-main" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
    <filter id="shadow-soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <filter id="shadow-sharp" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="blur-ground" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <linearGradient id="shield-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="40%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="shield-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
  </defs>
  <ellipse cx="128" cy="226" rx="76" ry="14" fill="#0F172A" opacity="0.22" filter="url(#blur-ground)"/>
  
  <g filter="url(#shadow-main)">
    <!-- 3D Puffy Shield Body -->
    <path d="M128,42 C178,42 206,62 206,124 C206,182 148,212 128,220 C108,212 50,182 50,124 C50,62 78,42 128,42 Z" fill="url(#shield-blue)"/>
    <!-- Outer Silver Rim -->
    <path d="M128,46 C174,46 198,64 198,122 C198,176 146,204 128,212 C110,204 58,176 58,122 C58,64 82,46 128,46 Z" fill="none" stroke="url(#shield-rim)" stroke-width="7" opacity="0.6"/>
    
    <!-- Specular Crescent on Left -->
    <path d="M72,70 C64,94 64,124 70,146 C64,126 64,100 72,70 Z" fill="#FFFFFF" opacity="0.75"/>
    
    <!-- White 3D Checkmark Emblem in Center -->
    <g filter="url(#shadow-soft)">
      <circle cx="128" cy="128" r="32" fill="#FFFFFF"/>
      <path d="M114,128 L124,138 L144,118" fill="none" stroke="#2563EB" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>