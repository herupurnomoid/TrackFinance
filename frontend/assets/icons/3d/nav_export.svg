<svg viewBox="0 0 256 256" width="256" height="256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <filter id="shadow-main" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
    <filter id="shadow-soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <filter id="shadow-sharp" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="blur-ground" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <linearGradient id="sheet-base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="arrow-up-grad" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="40%" stop-color="#3B82F6"/>
      <stop offset="85%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="arrow-down-grad" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="40%" stop-color="#22C55E"/>
      <stop offset="85%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#14532D"/>
    </linearGradient>
    <linearGradient id="fold-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>

  <ellipse cx="128" cy="226" rx="78" ry="14" fill="#0F172A" opacity="0.22" filter="url(#blur-ground)"/>

  <g filter="url(#shadow-main)">
    <!-- Main Folded Document -->
    <path d="M 64 42 L 148 42 L 192 86 L 192 202 Q 192 216 178 216 L 64 216 Q 50 216 50 202 L 50 56 Q 50 42 64 42 Z" fill="url(#sheet-base)"/>
    <path d="M 148 42 L 148 76 Q 148 86 158 86 L 192 86 Z" fill="url(#fold-grad)"/>

    <!-- Document Data Rows -->
    <rect x="74" y="80" width="56" height="8" rx="4" fill="#93C5FD" opacity="0.8"/>
    <rect x="74" y="102" width="68" height="7" rx="3.5" fill="#CBD5E1"/>
    <rect x="74" y="120" width="50" height="7" rx="3.5" fill="#CBD5E1"/>

    <!-- 3D Upward Arrow (Ekspor / Upload) Left Side -->
    <g filter="url(#shadow-main)" transform="translate(68, 126)">
      <circle cx="28" cy="28" r="32" fill="url(#arrow-up-grad)"/>
      <ellipse cx="28" cy="6" rx="16" ry="5" fill="#DBEAFE" opacity="0.6"/>
      <!-- Up Arrow -->
      <path d="M 28 12 L 44 28 L 34 28 L 34 44 L 22 44 L 22 28 L 12 28 Z" fill="#FFFFFF" filter="url(#shadow-sharp)"/>
    </g>

    <!-- 3D Downward Arrow (Impor / Download) Right Side -->
    <g filter="url(#shadow-main)" transform="translate(132, 126)">
      <circle cx="28" cy="28" r="32" fill="url(#arrow-down-grad)"/>
      <ellipse cx="28" cy="6" rx="16" ry="5" fill="#DCFCE7" opacity="0.6"/>
      <!-- Down Arrow -->
      <path d="M 28 44 L 12 28 L 22 28 L 22 12 L 34 12 L 34 28 L 44 28 Z" fill="#FFFFFF" filter="url(#shadow-sharp)"/>
    </g>
  </g>
</svg>