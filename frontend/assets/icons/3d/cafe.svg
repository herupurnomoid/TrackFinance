<svg viewBox="0 0 256 256" width="256" height="256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <filter id="shadow-main" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
    <filter id="shadow-soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <filter id="shadow-sharp" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="blur-ground" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <linearGradient id="cup-coffee" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
  </defs>
  <ellipse cx="128" cy="226" rx="68" ry="14" fill="#0F172A" opacity="0.22" filter="url(#blur-ground)"/>
  <g filter="url(#shadow-main)">
    <!-- Cup Body -->
    <path d="M72 82 L86 200 C88 208 94 214 104 214 L152 214 C162 214 168 208 170 200 L184 82 Z" fill="url(#cup-coffee)"/>
    <!-- Ribbed Sleeve -->
    <path d="M78 126 L82 174 L174 174 L178 126 Z" fill="url(#sleeve)"/>
    <ellipse cx="128" cy="150" rx="16" ry="12" fill="#FDE68A"/>
    <!-- Coffee Bean Icon on Sleeve -->
    <ellipse cx="128" cy="150" rx="7" ry="5" fill="#78350F" transform="rotate(-30 128 150)"/>
    <!-- Lid -->
    <ellipse cx="128" cy="80" rx="60" ry="14" fill="#64748B"/>
    <ellipse cx="128" cy="76" rx="54" ry="10" fill="#334155"/>
    <rect x="120" y="66" width="16" height="12" rx="4" fill="#1E293B"/>
    <!-- Steam Heart -->
    <path d="M128 44 C120 30 102 36 112 50 L128 62 L144 50 C154 36 136 30 128 44 Z" fill="#CA8A04" opacity="0.6"/>
  </g>
</svg>