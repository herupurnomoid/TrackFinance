<svg viewBox="0 0 256 256" width="256" height="256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <filter id="shadow-main" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
    <filter id="shadow-soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <filter id="shadow-sharp" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="blur-ground" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <linearGradient id="water-grad" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="25%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <radialGradient id="droplet-glow" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="40%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </radialGradient>
    <linearGradient id="ripple-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  <ellipse cx="128" cy="226" rx="80" ry="14" fill="#0F172A" opacity="0.22" filter="url(#blur-ground)"/>
  
  <!-- Outer Ripple Rings -->
  <ellipse cx="128" cy="204" rx="88" ry="24" fill="none" stroke="url(#ripple-grad)" stroke-width="7" opacity="0.45" filter="url(#shadow-soft)"/>
  <ellipse cx="128" cy="204" rx="64" ry="18" fill="none" stroke="url(#ripple-grad)" stroke-width="9" opacity="0.75" filter="url(#shadow-soft)"/>
  
  <!-- 3D Big Glossy Water Droplet -->
  <g filter="url(#shadow-main)">
    <path d="M128,46 C128,46 72,130 72,170 C72,204 97,222 128,222 C159,222 184,204 184,170 C184,130 128,46 128,46 Z" fill="url(#water-grad)"/>
    <!-- Specular Arc Highlights -->
    <path d="M110,80 C95,110 88,140 88,168 C88,188 96,204 110,210 C102,204 96,188 96,168 C96,138 106,108 118,84 Z" fill="#FFFFFF" opacity="0.85"/>
    <ellipse cx="148" cy="162" rx="14" ry="22" transform="rotate(25 148 162)" fill="#FFFFFF" opacity="0.45"/>
    <circle cx="128" cy="74" r="5" fill="#FFFFFF" opacity="0.9"/>
  </g>
</svg>