<svg viewBox="0 0 256 256" width="256" height="256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <filter id="shadow-main" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
    <filter id="shadow-soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <filter id="shadow-sharp" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="blur-ground" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <linearGradient id="shop-wall" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="awning-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F43F5E"/><stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <linearGradient id="awning-white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="door-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/><stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <ellipse cx="128" cy="226" rx="88" ry="14" fill="#0F172A" opacity="0.22" filter="url(#blur-ground)"/>

  <g filter="url(#shadow-main)">
    <!-- Shop Building Wall -->
    <rect x="62" y="112" width="132" height="98" rx="16" fill="url(#shop-wall)"/>

    <!-- Shop Display Window (Left) -->
    <rect x="76" y="132" width="46" height="52" rx="8" fill="#E2E8F0"/>
    <rect x="80" y="136" width="38" height="44" rx="6" fill="#38BDF8" opacity="0.6"/>
    <!-- Window Glare -->
    <path d="M84 172 L112 144 L114 150 L90 174 Z" fill="#FFFFFF" opacity="0.6"/>

    <!-- Shop Entrance Door (Right) -->
    <rect x="136" y="132" width="44" height="78" rx="8" fill="url(#door-blue)"/>
    <circle cx="144" cy="172" r="4" fill="#FDE047"/>

    <!-- 3D Scalloped Awning Canopy -->
    <g filter="url(#shadow-main)">
      <!-- Awning top slant -->
      <polygon points="46,112 210,112 216,134 40,134" fill="#BE123C"/>
      <!-- Scalloped stripes -->
      <path d="M40 112 L68 112 L66 134 C66 142 40 142 40 134 Z" fill="url(#awning-red)"/>
      <path d="M68 112 L96 112 L94 134 C94 142 66 142 66 134 Z" fill="url(#awning-white)"/>
      <path d="M96 112 L124 112 L122 134 C122 142 94 142 94 134 Z" fill="url(#awning-red)"/>
      <path d="M124 112 L152 112 L150 134 C150 142 122 142 122 134 Z" fill="url(#awning-white)"/>
      <path d="M152 112 L180 112 L178 134 C178 142 150 142 150 134 Z" fill="url(#awning-red)"/>
      <path d="M180 112 L210 112 L216 134 C216 142 178 142 178 134 Z" fill="url(#awning-white)"/>
    </g>

    <!-- Hanging 3D SALE percentage tag -->
    <g filter="url(#shadow-soft)" transform="rotate(-15 186 160)">
      <rect x="172" y="146" width="30" height="42" rx="6" fill="#FACC15"/>
      <circle cx="187" cy="154" r="3" fill="#854D0E"/>
      <text x="178" y="174" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#854D0E">%</text>
    </g>
  </g>
</svg>
