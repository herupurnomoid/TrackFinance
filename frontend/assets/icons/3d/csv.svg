<svg viewBox="0 0 256 256" width="256" height="256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Filter Bayangan 3D Lembut -->
    <filter id="shadow-main" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
    <filter id="shadow-soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.20"/>
    </filter>
    <filter id="shadow-sharp" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <filter id="blur-ground" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <!-- Gradasi Lembaran Spreadsheet 3D -->
    <linearGradient id="sheet-grad-csv" x1="0.1" y1="0.1" x2="0.9" y2="0.95">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>

    <!-- Gradasi Lipatan Sudut Atas -->
    <linearGradient id="fold-grad-csv" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DCFCE7"/>
      <stop offset="50%" stop-color="#BBF7D0"/>
      <stop offset="100%" stop-color="#86EFAC"/>
    </linearGradient>

    <!-- Gradasi Badge Hijau CSV 3D -->
    <linearGradient id="csv-green-grad" x1="0.1" y1="0.1" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="40%" stop-color="#10B981"/>
      <stop offset="85%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Gradasi Header Tabel Grid -->
    <linearGradient id="header-grid-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Bayangan Dasar Melayang -->
  <ellipse cx="128" cy="226" rx="76" ry="14" fill="#0F172A" opacity="0.22" filter="url(#blur-ground)"/>

  <g filter="url(#shadow-main)" transform="rotate(3 128 128)">
    <!-- Lembaran Dokumen 3D dengan Sudut Terlipat -->
    <path d="M 62 44 L 146 44 L 194 92 L 194 204 Q 194 216 182 216 L 62 216 Q 50 216 50 204 L 50 56 Q 50 44 62 44 Z" fill="url(#sheet-grad-csv)"/>

    <!-- Lipatan Sudut Kanan Atas 3D -->
    <g filter="url(#shadow-sharp)">
      <path d="M 146 44 L 146 82 Q 146 92 156 92 L 194 92 Z" fill="url(#fold-grad-csv)"/>
    </g>

    <!-- Kilauan Cahaya Kaca Melengkung di Dokumen -->
    <path d="M 50 70 Q 120 120 194 80 L 194 60 Q 120 100 50 50 Z" fill="#FFFFFF" opacity="0.25"/>

    <!-- Garis Baris Data Atas -->
    <rect x="70" y="66" width="60" height="7" rx="3.5" fill="#10B981" opacity="0.3"/>
    <rect x="70" y="80" width="48" height="6" rx="3" fill="#A7F3D0"/>

    <!-- Badge 3D CSV Menempel Tebal -->
    <g filter="url(#shadow-sharp)">
      <!-- Lapisan Dasar Badge Hijau Tebal -->
      <rect x="62" y="104" width="120" height="42" rx="10" fill="url(#csv-green-grad)"/>
      <!-- Kilauan Cahaya Atas Badge Hijau -->
      <path d="M 64 106 Q 122 118 180 108 L 180 105 Q 122 114 64 105 Z" fill="#FFFFFF" opacity="0.4"/>
      <!-- Ikon Tabel & Teks CSV Timbul Putih -->
      <g filter="url(#shadow-sharp)">
        <!-- Emblem Mini Table Grid -->
        <rect x="73" y="113" width="18" height="24" rx="3" fill="#FFFFFF"/>
        <rect x="75" y="115" width="14" height="4" rx="1" fill="#059669"/>
        <line x1="82" y1="115" x2="82" y2="135" stroke="#10B981" stroke-width="1.2"/>
        <line x1="75" y1="124" x2="89" y2="124" stroke="#10B981" stroke-width="1.2"/>
        <line x1="75" y1="130" x2="89" y2="130" stroke="#10B981" stroke-width="1.2"/>

        <!-- Teks 'CSV' Tebal Modern -->
        <text x="98" y="133" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="22" letter-spacing="1.5" fill="#FFFFFF">CSV</text>
      </g>
    </g>

    <!-- Mini Spreadsheet Grid 3D di Bawah Dokumen -->
    <g transform="translate(66, 158)">
      <!-- Kotak Tabel Sheet -->
      <rect x="0" y="0" width="112" height="48" rx="6" fill="#FFFFFF" filter="url(#shadow-sharp)"/>
      <!-- Header Tabel Hijau -->
      <path d="M 0 6 Q 0 0 6 0 L 106 0 Q 112 0 112 6 L 112 14 L 0 14 Z" fill="url(#header-grid-grad)"/>
      <!-- Header Column Separators -->
      <line x1="36" y1="2" x2="36" y2="12" stroke="#FFFFFF" stroke-width="1" opacity="0.7"/>
      <line x1="74" y1="2" x2="74" y2="12" stroke="#FFFFFF" stroke-width="1" opacity="0.7"/>

      <!-- Baris 1 Tabel -->
      <rect x="4" y="18" width="28" height="6" rx="2" fill="#E2E8F0"/>
      <rect x="40" y="18" width="30" height="6" rx="2" fill="#D1FAE5"/>
      <rect x="78" y="18" width="28" height="6" rx="2" fill="#BBF7D0"/>

      <!-- Baris 2 Tabel -->
      <rect x="4" y="28" width="28" height="6" rx="2" fill="#F1F5F9"/>
      <rect x="40" y="28" width="30" height="6" rx="2" fill="#E2E8F0"/>
      <rect x="78" y="28" width="28" height="6" rx="2" fill="#86EFAC"/>

      <!-- Baris 3 Tabel -->
      <rect x="4" y="38" width="28" height="6" rx="2" fill="#E2E8F0"/>
      <rect x="40" y="38" width="30" height="6" rx="2" fill="#D1FAE5"/>
      <rect x="78" y="38" width="28" height="6" rx="2" fill="#D1FAE5"/>
    </g>
  </g>
</svg>
