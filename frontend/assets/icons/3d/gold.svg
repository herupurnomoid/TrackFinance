<svg viewBox="0 0 256 256" width="256" height="256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <filter id="shadow-main" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
    <filter id="shadow-soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <filter id="shadow-sharp" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="blur-ground" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <linearGradient id="gold-top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="40%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="gold-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="gold-side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
  </defs>
  <ellipse cx="128" cy="226" rx="84" ry="14" fill="#0F172A" opacity="0.22" filter="url(#blur-ground)"/>
  
  <g filter="url(#shadow-main)">
    <!-- Bottom Left Ingot -->
    <g transform="translate(0, 30)">
      <path d="M44,140 L70,108 L142,108 L116,140 Z" fill="url(#gold-top)"/>
      <path d="M44,140 L116,140 L108,168 L36,168 Z" fill="url(#gold-front)"/>
      <path d="M116,140 L142,108 L134,136 L108,168 Z" fill="url(#gold-side)"/>
    </g>
    <!-- Bottom Right Ingot -->
    <g transform="translate(74, 30)">
      <path d="M44,140 L70,108 L142,108 L116,140 Z" fill="url(#gold-top)"/>
      <path d="M44,140 L116,140 L108,168 L36,168 Z" fill="url(#gold-front)"/>
      <path d="M116,140 L142,108 L134,136 L108,168 Z" fill="url(#gold-side)"/>
    </g>
    <!-- Top Pyramid Ingot -->
    <g transform="translate(37, -18)">
      <path d="M44,140 L70,108 L142,108 L116,140 Z" fill="url(#gold-top)"/>
      <path d="M44,140 L116,140 L108,168 L36,168 Z" fill="url(#gold-front)"/>
      <path d="M116,140 L142,108 L134,136 L108,168 Z" fill="url(#gold-side)"/>
      <!-- Stamp 999.9 -->
      <text x="76" y="130" font-family="sans-serif" font-size="11" font-weight="bold" fill="#78350F" opacity="0.8">999.9</text>
    </g>
    
    <!-- Sparkle Stars -->
    <polygon points="178,74 182,84 192,88 182,92 178,102 174,92 164,88 174,84" fill="#FFFFFF"/>
    <polygon points="68,124 71,131 78,134 71,137 68,144 65,137 58,134 65,131" fill="#FFFFFF"/>
  </g>
</svg>