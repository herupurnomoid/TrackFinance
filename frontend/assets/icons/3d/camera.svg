<svg viewBox="0 0 256 256" width="256" height="256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <filter id="shadow-main" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
    <filter id="shadow-soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <filter id="shadow-sharp" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="blur-ground" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <linearGradient id="cam-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="50%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <radialGradient id="cam-lens" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="35%" stop-color="#0284C7"/>
      <stop offset="70%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
  </defs>
  <ellipse cx="128" cy="226" rx="80" ry="14" fill="#0F172A" opacity="0.22" filter="url(#blur-ground)"/>
  
  <g filter="url(#shadow-main)">
    <!-- Top Flash Block & Shutter -->
    <rect x="94" y="62" width="68" height="24" rx="8" fill="#BE123C"/>
    <rect x="66" y="68" width="20" height="12" rx="4" fill="#F59E0B"/>
    
    <!-- Camera Body -->
    <rect x="46" y="80" width="164" height="130" rx="30" fill="url(#cam-body)"/>
    <rect x="52" y="84" width="152" height="14" rx="6" fill="#FFFFFF" opacity="0.3"/>
    
    <!-- Big 3D Lens Ring & Glass -->
    <circle cx="128" cy="148" r="46" fill="#334155" filter="url(#shadow-soft)"/>
    <circle cx="128" cy="148" r="38" fill="url(#cam-lens)"/>
    <ellipse cx="116" cy="136" rx="14" ry="7" transform="rotate(-30 116 136)" fill="#FFFFFF" opacity="0.75"/>
    <circle cx="144" cy="162" r="5" fill="#38BDF8" opacity="0.8"/>
  </g>
</svg>