<svg viewBox="0 0 256 256" width="256" height="256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <filter id="shadow-main" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
    <filter id="shadow-soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <filter id="shadow-sharp" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="blur-ground" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <linearGradient id="gift-box" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="50%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#9F1239"/>
    </linearGradient>
    <linearGradient id="gift-lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="ribbon-gold" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="star-sparkle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>
  </defs>

  <ellipse cx="128" cy="226" rx="82" ry="14" fill="#0F172A" opacity="0.22" filter="url(#blur-ground)"/>

  <g filter="url(#shadow-main)">
    <!-- Main Gift Box Base -->
    <rect x="62" y="112" width="132" height="96" rx="16" fill="url(#gift-box)"/>
    <!-- Vertical Gold Ribbon on Box -->
    <rect x="116" y="112" width="24" height="96" fill="url(#ribbon-gold)"/>

    <!-- Overlapping Beveled Lid -->
    <g filter="url(#shadow-soft)">
      <rect x="52" y="94" width="152" height="32" rx="12" fill="url(#gift-lid)"/>
      <rect x="114" y="94" width="28" height="32" fill="url(#ribbon-gold)"/>
      <!-- Lid Glossy Highlight -->
      <path d="M62 98 L194 98" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    </g>

    <!-- Large Puffy 3D Ribbon Bow -->
    <g filter="url(#shadow-main)">
      <!-- Left Loop -->
      <path d="M128 92 C104 62 66 62 82 86 C94 100 118 96 128 94 Z" fill="url(#ribbon-gold)"/>
      <ellipse cx="94" cy="76" rx="8" ry="4" fill="#FFFFFF" opacity="0.5" transform="rotate(-20 94 76)"/>

      <!-- Right Loop -->
      <path d="M128 92 C152 62 190 62 174 86 C162 100 138 96 128 94 Z" fill="url(#ribbon-gold)"/>
      <ellipse cx="162" cy="76" rx="8" ry="4" fill="#FFFFFF" opacity="0.5" transform="rotate(20 162 76)"/>

      <!-- Center Knot -->
      <circle cx="128" cy="92" r="13" fill="#CA8A04"/>
      <circle cx="128" cy="91" r="10" fill="url(#ribbon-gold)"/>
      <circle cx="126" cy="89" r="4" fill="#FFFFFF" opacity="0.6"/>
    </g>

    <!-- Floating 3D Sparkle Stars -->
    <!-- Top Left Star -->
    <path d="M52 74 Q52 86 40 86 Q52 86 52 98 Q52 86 64 86 Q52 86 52 74 Z" fill="url(#star-sparkle)" filter="url(#shadow-soft)"/>
    <!-- Top Right Big Star -->
    <path d="M206 58 Q206 72 192 72 Q206 72 206 86 Q206 72 220 72 Q206 72 206 58 Z" fill="url(#star-sparkle)" filter="url(#shadow-soft)"/>
    <!-- Floating Gold Coin -->
    <circle cx="198" cy="120" r="12" fill="url(#ribbon-gold)" filter="url(#shadow-sharp)"/>
  </g>
</svg>
