<svg viewBox="0 0 256 256" width="256" height="256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <filter id="shadow-main" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
    <filter id="shadow-soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <filter id="shadow-sharp" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="blur-ground" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <linearGradient id="book-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="book-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="book-emerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <ellipse cx="128" cy="226" rx="82" ry="14" fill="#0F172A" opacity="0.22" filter="url(#blur-ground)"/>
  
  <g filter="url(#shadow-main)">
    <!-- Book 1 (Bottom - Blue) -->
    <rect x="62" y="172" width="132" height="34" rx="10" fill="url(#book-blue)"/>
    <rect x="68" y="178" width="120" height="22" rx="4" fill="#F8FAFC"/>
    <rect x="58" y="172" width="16" height="34" rx="8" fill="#0369A1"/>
    
    <!-- Book 2 (Middle - Orange) -->
    <rect x="70" y="130" width="124" height="34" rx="10" fill="url(#book-orange)"/>
    <rect x="76" y="136" width="112" height="22" rx="4" fill="#F8FAFC"/>
    <rect x="66" y="130" width="16" height="34" rx="8" fill="#C2410C"/>
    
    <!-- Book 3 (Top - Emerald) -->
    <rect x="76" y="88" width="116" height="34" rx="10" fill="url(#book-emerald)"/>
    <rect x="82" y="94" width="104" height="22" rx="4" fill="#F8FAFC"/>
    <rect x="72" y="88" width="16" height="34" rx="8" fill="#047857"/>
    
    <!-- Red Ribbon Bookmark hanging down -->
    <path d="M154,88 L154,142 L164,134 L174,142 L174,88 Z" fill="#EF4444" filter="url(#shadow-sharp)"/>
    <!-- Specular Highlight on Top Spine -->
    <line x1="74" y1="92" x2="74" y2="118" stroke="#A7F3D0" stroke-width="3" opacity="0.8"/>
  </g>
</svg>