<svg viewBox="0 0 256 256" width="256" height="256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <filter id="shadow-main" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
    <filter id="shadow-soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <filter id="shadow-sharp" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="blur-ground" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <linearGradient id="cat-blue" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="35%" stop-color="#3B82F6"/>
      <stop offset="85%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="cat-green" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#86EFAC"/>
      <stop offset="35%" stop-color="#22C55E"/>
      <stop offset="85%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#14532D"/>
    </linearGradient>
    <linearGradient id="cat-rose" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="35%" stop-color="#F43F5E"/>
      <stop offset="85%" stop-color="#BE123C"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="cat-amber" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="85%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
  </defs>

  <ellipse cx="128" cy="226" rx="80" ry="14" fill="#0F172A" opacity="0.22" filter="url(#blur-ground)"/>

  <g filter="url(#shadow-main)">
    <!-- 1. Top-Left: Blue Tile -->
    <g filter="url(#shadow-soft)">
      <rect x="42" y="44" width="76" height="76" rx="24" fill="url(#cat-blue)"/>
      <ellipse cx="80" cy="54" rx="26" ry="6" fill="#DBEAFE" opacity="0.6"/>
      <!-- Circle Symbol -->
      <circle cx="80" cy="82" r="16" fill="#FFFFFF" filter="url(#shadow-sharp)"/>
    </g>

    <!-- 2. Top-Right: Green Tile -->
    <g filter="url(#shadow-soft)">
      <rect x="138" y="44" width="76" height="76" rx="24" fill="url(#cat-green)"/>
      <ellipse cx="176" cy="54" rx="26" ry="6" fill="#DCFCE7" opacity="0.6"/>
      <!-- Diamond/Triangle Symbol -->
      <path d="M 176 68 L 192 96 L 160 96 Z" fill="#FFFFFF" filter="url(#shadow-sharp)"/>
    </g>

    <!-- 3. Bottom-Left: Rose Tile -->
    <g filter="url(#shadow-soft)">
      <rect x="42" y="136" width="76" height="76" rx="24" fill="url(#cat-rose)"/>
      <ellipse cx="80" cy="146" rx="26" ry="6" fill="#FFE4E6" opacity="0.6"/>
      <!-- Square Symbol -->
      <rect x="65" y="159" width="30" height="30" rx="8" fill="#FFFFFF" filter="url(#shadow-sharp)"/>
    </g>

    <!-- 4. Bottom-Right: Amber Tile -->
    <g filter="url(#shadow-soft)">
      <rect x="138" y="136" width="76" height="76" rx="24" fill="url(#cat-amber)"/>
      <ellipse cx="176" cy="146" rx="26" ry="6" fill="#FEF3C7" opacity="0.6"/>
      <!-- Star/Ring Symbol -->
      <circle cx="176" cy="174" r="15" fill="none" stroke="#FFFFFF" stroke-width="7" filter="url(#shadow-sharp)"/>
    </g>
  </g>
</svg>