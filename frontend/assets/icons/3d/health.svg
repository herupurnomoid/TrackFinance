<svg viewBox="0 0 256 256" width="256" height="256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <filter id="shadow-main" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
    <filter id="shadow-soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <filter id="shadow-sharp" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="blur-ground" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <linearGradient id="kit-body" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="kit-trim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="cross-grad" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="50%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#9F1239"/>
    </linearGradient>
    <linearGradient id="pill-red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <linearGradient id="pill-white" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>

  <ellipse cx="128" cy="228" rx="84" ry="14" fill="#0F172A" opacity="0.22" filter="url(#blur-ground)"/>

  <g filter="url(#shadow-main)">
    <!-- First Aid Box Handle -->
    <path d="M104 88 C104 68 152 68 152 88" fill="none" stroke="url(#kit-trim)" stroke-width="12" stroke-linecap="round"/>

    <!-- Main Medical Kit Box -->
    <rect x="54" y="86" width="148" height="114" rx="28" fill="url(#kit-body)"/>
    <!-- Box Latch / Top seam -->
    <path d="M54 120 L202 120" stroke="#94A3B8" stroke-width="2"/>
    <rect x="114" y="112" width="28" height="16" rx="6" fill="url(#kit-trim)"/>

    <!-- Raised 3D Medical Cross -->
    <g filter="url(#shadow-soft)">
      <!-- Vertical bar -->
      <rect x="115" y="130" width="26" height="56" rx="8" fill="url(#cross-grad)"/>
      <!-- Horizontal bar -->
      <rect x="100" y="145" width="56" height="26" rx="8" fill="url(#cross-grad)"/>
      <!-- Highlight -->
      <ellipse cx="120" cy="138" rx="6" ry="3" fill="#FFFFFF" opacity="0.6"/>
    </g>

    <!-- Glossy Box Highlight -->
    <path d="M68 98 C68 94 74 92 84 92 L144 92 C154 92 160 94 160 98 C144 102 84 102 68 98 Z" fill="#FFFFFF" opacity="0.6"/>

    <!-- 3D Two-Tone Capsule Pill Floating in Front -->
    <g filter="url(#shadow-main)" transform="rotate(-28 178 186)">
      <!-- Red Half -->
      <path d="M166 166 C166 156 174 148 184 148 C194 148 202 156 202 166 L202 186 L166 186 Z" fill="url(#pill-red)"/>
      <!-- White Half -->
      <path d="M166 186 L202 186 L202 206 C202 216 194 224 184 224 C174 224 166 216 166 206 Z" fill="url(#pill-white)"/>
      <!-- Pill Highlight -->
      <path d="M172 154 L172 212" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    </g>
  </g>
</svg>
