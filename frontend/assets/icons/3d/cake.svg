<svg viewBox="0 0 256 256" width="256" height="256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <filter id="shadow-main" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
    <filter id="shadow-soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <filter id="shadow-sharp" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="blur-ground" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <linearGradient id="cake-sponge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="cake-cream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="50%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <radialGradient id="candle-flame" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </radialGradient>
  </defs>
  <ellipse cx="128" cy="226" rx="80" ry="14" fill="#0F172A" opacity="0.22" filter="url(#blur-ground)"/>
  
  <g filter="url(#shadow-main)">
    <!-- Bottom Cake Layer -->
    <path d="M54,160 C54,160 54,204 128,204 C202,204 202,160 202,160 L202,176 C202,208 128,216 128,216 C128,216 54,208 54,176 Z" fill="url(#cake-sponge)"/>
    <ellipse cx="128" cy="164" rx="74" ry="24" fill="url(#cake-cream)"/>
    <!-- Frosting drips -->
    <path d="M54,164 C64,180 74,180 84,164 C94,184 104,184 114,164 C124,184 134,184 144,164 C154,180 164,180 174,164 C184,184 194,184 202,164 L202,174 C194,190 184,190 174,174 C164,190 154,190 144,174 C134,190 124,190 114,174 C104,190 94,190 84,174 C74,190 64,190 54,174 Z" fill="url(#cake-cream)"/>
    
    <!-- Top Cake Tier -->
    <ellipse cx="128" cy="136" rx="52" ry="18" fill="url(#cake-cream)"/>
    <ellipse cx="128" cy="132" rx="46" ry="14" fill="#FFF1F2"/>
    
    <!-- Lit Candle -->
    <rect x="124" y="86" width="8" height="40" rx="3" fill="#38BDF8"/>
    <!-- Candle Flame -->
    <g filter="url(#shadow-soft)">
      <path d="M128,52 C124,64 120,72 128,82 C136,72 132,64 128,52 Z" fill="url(#candle-flame)"/>
      <ellipse cx="128" cy="74" rx="3" ry="5" fill="#FEF08A"/>
    </g>
  </g>
</svg>