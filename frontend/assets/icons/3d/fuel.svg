<svg viewBox="0 0 256 256" width="256" height="256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <filter id="shadow-main" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
    <filter id="shadow-soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <filter id="shadow-sharp" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="blur-ground" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <linearGradient id="pump-body" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="35%" stop-color="#EF4444"/>
      <stop offset="85%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="pump-roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="fuel-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="nozzle-yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="40%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="metal-silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="drop-amber" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  
  <ellipse cx="128" cy="226" rx="76" ry="14" fill="#0F172A" opacity="0.24" filter="url(#blur-ground)"/>

  <g filter="url(#shadow-main)">
    <!-- Gas Pump Main Body -->
    <rect x="68" y="70" width="108" height="142" rx="24" fill="url(#pump-body)"/>
    
    <!-- Top Cap / Highlight -->
    <path d="M 68 84 Q 68 70 88 70 L 156 70 Q 176 70 176 84 L 176 76 Q 176 64 156 64 L 88 64 Q 68 64 68 76 Z" fill="url(#pump-roof)" opacity="0.8"/>
    <ellipse cx="122" cy="74" rx="44" ry="5" fill="#FECACA" opacity="0.5"/>

    <!-- Meter Screen Display -->
    <rect x="84" y="90" width="76" height="48" rx="10" fill="url(#fuel-screen)" filter="url(#shadow-sharp)"/>
    <rect x="88" y="94" width="68" height="20" rx="4" fill="#022C22"/>
    <text x="94" y="109" font-family="monospace" font-size="14" font-weight="bold" fill="#34D399">10.00L</text>
    <text x="94" y="130" font-family="monospace" font-size="11" font-weight="bold" fill="#94A3B8">Rp 100K</text>

    <!-- Fuel Grade Emblem -->
    <circle cx="122" cy="170" r="18" fill="url(#nozzle-yellow)" filter="url(#shadow-soft)"/>
    <text x="114" y="176" font-family="sans-serif" font-size="16" font-weight="900" fill="#78350F">92</text>

    <!-- Hose Pipe Swirling on Side -->
    <path d="M 172 165 C 195 165, 205 130, 196 110 C 190 95, 178 85, 176 96" fill="none" stroke="#334155" stroke-width="10" stroke-linecap="round"/>
    
    <!-- Fuel Nozzle Handle -->
    <g transform="translate(162, 70) rotate(15)" filter="url(#shadow-soft)">
      <path d="M 12 12 L 28 8 L 32 20 L 22 26 Z" fill="url(#nozzle-yellow)"/>
      <path d="M 28 8 L 44 -4 L 48 2 L 32 14 Z" fill="url(#metal-silver)"/>
      <path d="M 14 24 C 18 36, 6 42, 2 34 Z" fill="#1E293B"/>
    </g>

    <!-- Floating Droplet -->
    <g filter="url(#shadow-soft)">
      <path d="M 204 62 C 204 62, 196 74, 196 80 C 196 85, 200 89, 204 89 C 208 89, 212 85, 212 80 C 212 74, 204 62, 204 62 Z" fill="url(#drop-amber)"/>
      <ellipse cx="202" cy="78" rx="2" ry="4" fill="#FFFFFF" opacity="0.6"/>
    </g>
  </g>
</svg>