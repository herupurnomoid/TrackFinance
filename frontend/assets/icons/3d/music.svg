<svg viewBox="0 0 256 256" width="256" height="256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <filter id="shadow-main" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
    <filter id="shadow-soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <filter id="shadow-sharp" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="blur-ground" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <linearGradient id="music-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="40%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6B21A8"/>
    </linearGradient>
    <linearGradient id="phone-head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  <ellipse cx="128" cy="226" rx="76" ry="14" fill="#0F172A" opacity="0.22" filter="url(#blur-ground)"/>
  
  <g filter="url(#shadow-main)">
    <!-- 3D Headphone Band Arch -->
    <path d="M64,142 C64,74 192,74 192,142" fill="none" stroke="url(#phone-head)" stroke-width="16" stroke-linecap="round"/>
    
    <!-- Left & Right Ear Cushions -->
    <rect x="46" y="130" width="24" height="48" rx="12" fill="#0369A1" filter="url(#shadow-soft)"/>
    <rect x="186" y="130" width="24" height="48" rx="12" fill="#0369A1" filter="url(#shadow-soft)"/>
    
    <!-- 3D Puffy Glossy Floating Double Musical Note -->
    <g filter="url(#shadow-main)">
      <!-- Left Note Head -->
      <ellipse cx="106" cy="184" rx="20" ry="15" transform="rotate(-20 106 184)" fill="url(#music-grad)"/>
      <ellipse cx="102" cy="178" rx="8" ry="4" transform="rotate(-20 102 178)" fill="#FFFFFF" opacity="0.75"/>
      <!-- Right Note Head -->
      <ellipse cx="156" cy="168" rx="20" ry="15" transform="rotate(-20 156 168)" fill="url(#music-grad)"/>
      <ellipse cx="152" cy="162" rx="8" ry="4" transform="rotate(-20 152 162)" fill="#FFFFFF" opacity="0.75"/>
      <!-- Stems & Top Beam -->
      <rect x="120" y="96" width="10" height="84" rx="5" fill="url(#music-grad)"/>
      <rect x="170" y="80" width="10" height="84" rx="5" fill="url(#music-grad)"/>
      <polygon points="120,96 180,80 180,98 120,114" fill="url(#music-grad)"/>
      <line x1="124" y1="100" x2="176" y2="86" stroke="#FFFFFF" stroke-width="3" opacity="0.8"/>
    </g>
  </g>
</svg>