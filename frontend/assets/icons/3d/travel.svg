<svg viewBox="0 0 256 256" width="256" height="256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <filter id="shadow-main" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
    <filter id="shadow-soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <filter id="shadow-sharp" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="blur-ground" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <linearGradient id="plane-body" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="plane-wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  <ellipse cx="128" cy="226" rx="74" ry="14" fill="#0F172A" opacity="0.22" filter="url(#blur-ground)"/>
  <g filter="url(#shadow-main)">
    <!-- Fluffy 3D Cloud Base -->
    <path d="M64 190 C48 190 40 178 48 166 C42 152 56 138 72 144 C82 128 108 128 118 144 C128 136 148 142 146 158 C158 162 160 180 148 190 Z" fill="#F1F5F9" opacity="0.9"/>
    <!-- Ascending 3D Airplane -->
    <g transform="rotate(-32 136 128)">
      <!-- Left Wing -->
      <polygon points="128,100 48,124 58,140 128,126" fill="url(#plane-wing)"/>
      <!-- Right Wing -->
      <polygon points="144,100 214,124 204,140 144,126" fill="url(#plane-wing)"/>
      <!-- Fuselage -->
      <path d="M136 44 C144 44 148 58 148 94 L148 174 C148 184 142 192 136 192 C130 192 124 184 124 174 L124 94 C124 58 128 44 136 44 Z" fill="url(#plane-body)"/>
      <!-- Cockpit Windshield -->
      <ellipse cx="136" cy="64" rx="8" ry="12" fill="#0284C7"/>
      <!-- Tail fin -->
      <polygon points="136,154 136,188 152,194 148,160" fill="url(#plane-wing)"/>
      <polygon points="112,184 160,184 156,192 116,192" fill="url(#plane-wing)"/>
      <!-- Highlight -->
      <ellipse cx="132" cy="110" rx="3" ry="40" fill="#FFFFFF" opacity="0.6"/>
    </g>
  </g>
</svg>