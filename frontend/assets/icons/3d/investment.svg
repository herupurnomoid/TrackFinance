<svg viewBox="0 0 256 256" width="256" height="256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <filter id="shadow-main" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
    <filter id="shadow-soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <filter id="shadow-sharp" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="blur-ground" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <linearGradient id="bar-1" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#93C5FD"/><stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="bar-2" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/><stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="bar-3" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/><stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="arrow-green" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="50%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="coin-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF08A"/><stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
  </defs>

  <ellipse cx="128" cy="226" rx="88" ry="14" fill="#0F172A" opacity="0.22" filter="url(#blur-ground)"/>

  <g filter="url(#shadow-main)">
    <!-- 3D Bar 1 (Shortest - Left) -->
    <g>
      <rect x="52" y="152" width="36" height="60" rx="10" fill="url(#bar-1)"/>
      <ellipse cx="70" cy="154" rx="18" ry="6" fill="#BFDBFE"/>
    </g>

    <!-- 3D Bar 2 (Medium - Center) -->
    <g>
      <rect x="108" y="120" width="36" height="92" rx="10" fill="url(#bar-2)"/>
      <ellipse cx="126" cy="122" rx="18" ry="6" fill="#93C5FD"/>
    </g>

    <!-- 3D Bar 3 (Tallest - Right) -->
    <g>
      <rect x="164" y="86" width="36" height="126" rx="10" fill="url(#bar-3)"/>
      <ellipse cx="182" cy="88" rx="18" ry="6" fill="#60A5FA"/>
    </g>

    <!-- Soaring 3D Trend Arrow (Vivid Green) -->
    <g filter="url(#shadow-main)">
      <!-- Arrow Trail Shaft -->
      <path d="M42 168 L98 126 L144 148 L198 62" fill="none" stroke="url(#arrow-green)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Arrow Head -->
      <path d="M174 54 L216 54 L216 96 L200 80 L188 92 L176 80 L188 68 Z" fill="url(#arrow-green)"/>
      <!-- Arrow Highlight -->
      <path d="M46 164 L98 122 L144 144 L196 60" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    </g>

    <!-- Shiny Gold Coin at Peak of Growth -->
    <g filter="url(#shadow-soft)">
      <circle cx="212" cy="46" r="16" fill="url(#coin-gold)"/>
      <circle cx="212" cy="46" r="12" fill="#FDE047"/>
      <text x="207" y="51" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#A16207">$</text>
    </g>
  </g>
</svg>
