<svg viewBox="0 0 256 256" width="256" height="256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <filter id="shadow-main" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
    <filter id="shadow-soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <filter id="shadow-sharp" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="blur-ground" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <linearGradient id="board-sheet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="80%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="bar-blue" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="60%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="bar-green" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="60%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="bar-rose" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="60%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#9F1239"/>
    </linearGradient>
    <linearGradient id="glass-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
  </defs>

  <ellipse cx="128" cy="226" rx="80" ry="14" fill="#0F172A" opacity="0.22" filter="url(#blur-ground)"/>

  <g filter="url(#shadow-main)">
    <!-- Clipboard / Base Sheet -->
    <rect x="44" y="38" width="168" height="174" rx="28" fill="url(#board-sheet)"/>
    <rect x="44" y="38" width="168" height="174" rx="28" fill="none" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Top Binder Clip 3D -->
    <rect x="96" y="24" width="64" height="22" rx="8" fill="#475569" filter="url(#shadow-sharp)"/>
    <rect x="108" y="16" width="40" height="14" rx="7" fill="none" stroke="#94A3B8" stroke-width="5"/>

    <!-- Base Axis Line -->
    <line x1="64" y1="184" x2="188" y2="184" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>

    <!-- 3D Bar 1 (Blue) -->
    <rect x="68" y="124" width="28" height="60" rx="8" fill="url(#bar-blue)" filter="url(#shadow-sharp)"/>
    <ellipse cx="82" cy="128" rx="10" ry="3" fill="#BFDBFE" opacity="0.8"/>

    <!-- 3D Bar 2 (Green) -->
    <rect x="106" y="88" width="28" height="96" rx="8" fill="url(#bar-green)" filter="url(#shadow-sharp)"/>
    <ellipse cx="120" cy="92" rx="10" ry="3" fill="#BBF7D0" opacity="0.8"/>

    <!-- 3D Bar 3 (Rose) -->
    <rect x="144" y="106" width="28" height="78" rx="8" fill="url(#bar-rose)" filter="url(#shadow-sharp)"/>
    <ellipse cx="158" cy="110" rx="10" ry="3" fill="#FECDD3" opacity="0.8"/>

    <!-- Upward Trend Line Overlay -->
    <path d="M 82 120 L 120 84 L 158 102 L 186 64" fill="none" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow-sharp)"/>
    <circle cx="186" cy="64" r="6" fill="#F59E0B"/>

    <!-- 3D Magnifying Glass Bottom-Right -->
    <g filter="url(#shadow-main)" transform="translate(130, 116)">
      <!-- Handle -->
      <path d="M 44 44 L 68 68" stroke="#1E293B" stroke-width="12" stroke-linecap="round"/>
      <path d="M 44 44 L 68 68" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
      
      <!-- Glass Rim 3D -->
      <circle cx="26" cy="26" r="28" fill="#FFFFFF" fill-opacity="0.25" stroke="url(#glass-rim)" stroke-width="8"/>
      <!-- Specular Arc -->
      <path d="M 10 18 A 20 20 0 0 1 34 8" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
      <!-- Inner Growth Arrow inside lens -->
      <path d="M 16 32 L 24 24 L 30 30 L 38 18" fill="none" stroke="#16A34A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 32 18 L 38 18 L 38 24" fill="none" stroke="#16A34A" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>