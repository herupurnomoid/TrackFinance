<svg viewBox="0 0 256 256" width="256" height="256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <filter id="shadow-main" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
    <filter id="shadow-soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <filter id="shadow-sharp" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="blur-ground" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <linearGradient id="cube-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="cube-left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#6B21A8"/>
    </linearGradient>
    <linearGradient id="cube-right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7E22CE"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <radialGradient id="sphere-coral" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="50%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#9F1239"/>
    </radialGradient>
    <radialGradient id="sphere-teal" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="50%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </radialGradient>
    <radialGradient id="sphere-amber" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </radialGradient>
  </defs>

  <ellipse cx="128" cy="226" rx="80" ry="14" fill="#0F172A" opacity="0.22" filter="url(#blur-ground)"/>

  <!-- Floating 3D Rounded Cube -->
  <g filter="url(#shadow-main)">
    <!-- Isometric Rounded Cube -->
    <!-- Top Face -->
    <path d="M128 66 L178 94 C184 98 184 104 178 108 L128 136 C124 138 120 138 116 136 L66 108 C60 104 60 98 66 94 L116 66 C120 64 124 64 128 66 Z" fill="url(#cube-top)"/>
    <!-- Left Face -->
    <path d="M62 104 L118 136 L118 194 C118 200 112 204 106 200 L62 174 C58 172 56 166 56 160 L56 114 C56 108 58 102 62 104 Z" fill="url(#cube-left)"/>
    <!-- Right Face -->
    <path d="M126 136 L182 104 C186 102 188 108 188 114 L188 160 C188 166 186 172 182 174 L138 200 C132 204 126 200 126 194 Z" fill="url(#cube-right)"/>

    <!-- Specular Highlight on Top Face -->
    <ellipse cx="122" cy="100" rx="34" ry="16" fill="#FFFFFF" opacity="0.35" transform="rotate(-15 122 100)"/>
  </g>

  <!-- 3 Floating 3D Spheres (Dots) -->
  <!-- Teal Sphere (Top Right) -->
  <g filter="url(#shadow-soft)">
    <circle cx="192" cy="74" r="20" fill="url(#sphere-teal)"/>
    <ellipse cx="186" cy="68" rx="6" ry="3" fill="#FFFFFF" opacity="0.65"/>
  </g>

  <!-- Coral Sphere (Bottom Left) -->
  <g filter="url(#shadow-soft)">
    <circle cx="56" cy="168" r="22" fill="url(#sphere-coral)"/>
    <ellipse cx="50" cy="162" rx="7" ry="3.5" fill="#FFFFFF" opacity="0.65"/>
  </g>

  <!-- Amber Sphere (Front Center Floating) -->
  <g filter="url(#shadow-main)">
    <circle cx="132" cy="176" r="24" fill="url(#sphere-amber)"/>
    <ellipse cx="125" cy="169" rx="8" ry="4" fill="#FFFFFF" opacity="0.7"/>
  </g>
</svg>
