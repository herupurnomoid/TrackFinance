<svg viewBox="0 0 256 256" width="256" height="256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <filter id="shadow-main" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
    <filter id="shadow-soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <filter id="shadow-sharp" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="blur-ground" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <linearGradient id="card-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="35%" stop-color="#6366F1"/>
      <stop offset="70%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>
    <linearGradient id="chip-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>
    <linearGradient id="accent-band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <ellipse cx="132" cy="226" rx="82" ry="14" fill="#0F172A" opacity="0.25" filter="url(#blur-ground)"/>

  <g filter="url(#shadow-main)" transform="rotate(-10 128 128)">
    <!-- 3D Card Thickness & Back -->
    <rect x="36" y="66" width="184" height="118" rx="18" fill="#1E1B4B"/>

    <!-- Main Card Front Face -->
    <rect x="34" y="62" width="184" height="118" rx="18" fill="url(#card-grad)"/>

    <!-- Specular Highlight Ribbon -->
    <path d="M 34 76 Q 120 120 218 80 L 218 64 Q 120 100 34 62 Z" fill="#FFFFFF" opacity="0.22"/>
    <path d="M 34 140 Q 120 160 218 135 L 218 145 Q 120 170 34 150 Z" fill="url(#accent-band)"/>

    <!-- EMV Chip Gold 3D -->
    <g filter="url(#shadow-sharp)">
      <rect x="58" y="96" width="34" height="28" rx="6" fill="url(#chip-gold)"/>
      <rect x="64" y="102" width="22" height="16" rx="3" fill="none" stroke="#713F12" stroke-width="1.2"/>
      <line x1="58" y1="110" x2="92" y2="110" stroke="#713F12" stroke-width="1.2"/>
      <line x1="75" y1="96" x2="75" y2="124" stroke="#713F12" stroke-width="1.2"/>
    </g>

    <!-- Contactless Wave Symbol -->
    <path d="M 104 102 A 8 8 0 0 1 104 118" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
    <path d="M 110 98 A 14 14 0 0 1 110 122" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
    <path d="M 116 94 A 20 20 0 0 1 116 126" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>

    <!-- Card Brand Spheres (Mastercard / Visa style overlap) -->
    <circle cx="178" cy="154" r="14" fill="#EF4444" opacity="0.9" filter="url(#shadow-sharp)"/>
    <circle cx="194" cy="154" r="14" fill="#F59E0B" opacity="0.85"/>

    <!-- Card Numbers Embossed Dots -->
    <g fill="#E0E7FF" opacity="0.75">
      <circle cx="62" cy="154" r="2.5"/>
      <circle cx="70" cy="154" r="2.5"/>
      <circle cx="78" cy="154" r="2.5"/>
      <circle cx="86" cy="154" r="2.5"/>

      <circle cx="98" cy="154" r="2.5"/>
      <circle cx="106" cy="154" r="2.5"/>
      <circle cx="114" cy="154" r="2.5"/>
      <circle cx="122" cy="154" r="2.5"/>

      <text x="136" y="157" font-family="monospace" font-size="10" font-weight="bold" fill="#FFFFFF">8820</text>
    </g>
  </g>
</svg>