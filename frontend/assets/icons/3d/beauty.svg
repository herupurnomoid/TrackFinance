<svg viewBox="0 0 256 256" width="256" height="256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <filter id="shadow-main" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
    <filter id="shadow-soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <filter id="shadow-sharp" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="blur-ground" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <linearGradient id="cosmetic-body" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#DDD6FE"/>
      <stop offset="40%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
    <linearGradient id="gold-cap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>
  </defs>
  <ellipse cx="128" cy="226" rx="70" ry="14" fill="#0F172A" opacity="0.22" filter="url(#blur-ground)"/>
  
  <g filter="url(#shadow-main)">
    <!-- Dispenser Bottle Base -->
    <rect x="86" y="96" width="84" height="124" rx="32" fill="url(#cosmetic-body)"/>
    <ellipse cx="128" cy="100" rx="36" ry="8" fill="#FFFFFF" opacity="0.4"/>
    <!-- Specular Highlight Strip -->
    <path d="M98,110 C96,130 96,180 102,204" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
    
    <!-- Golden Collar & Pump -->
    <rect x="112" y="80" width="32" height="18" rx="4" fill="url(#gold-cap)"/>
    <path d="M128,80 L128,52 C128,46 136,44 146,44 L156,48" fill="none" stroke="url(#gold-cap)" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Droplet Falling from Pump -->
    <circle cx="162" cy="72" r="6" fill="#F472B6" filter="url(#shadow-soft)"/>
    <ellipse cx="160" cy="70" rx="2" ry="1" fill="#FFFFFF" opacity="0.8"/>
  </g>
</svg>