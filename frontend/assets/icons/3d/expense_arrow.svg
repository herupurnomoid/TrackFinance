<svg viewBox="0 0 256 256" width="256" height="256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <filter id="shadow-main" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
    <filter id="shadow-soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <filter id="shadow-sharp" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="blur-ground" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <linearGradient id="arrow-red-grad" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="35%" stop-color="#F43F5E"/>
      <stop offset="75%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#9F1239"/>
    </linearGradient>
    <linearGradient id="arrow-red-bevel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="50%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <linearGradient id="specular-line-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="glow-ring-red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FB7185" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#E11D48" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Ground contact shadow -->
  <ellipse cx="128" cy="226" rx="74" ry="14" fill="#0F172A" opacity="0.25" filter="url(#blur-ground)"/>

  <!-- Subtle ambient glow circle -->
  <circle cx="128" cy="132" r="88" fill="url(#glow-ring-red)"/>

  <!-- 3D Downward Arrow Geometry -->
  <g filter="url(#shadow-main)">
    <!-- 3D Depth / Extrusion Shadow Layer -->
    <path d="M 94 48 L 162 48 L 162 144 L 208 144 L 128 224 L 48 144 L 94 144 Z" fill="#4C0519" transform="translate(0, 8)"/>

    <!-- Main Front Face (Panah Turun) -->
    <path d="M 94 44 L 162 44 L 162 140 L 208 140 L 128 220 L 48 140 L 94 140 Z" fill="url(#arrow-red-grad)"/>

    <!-- Top Cap Bevel Edge Highlight -->
    <rect x="94" y="44" width="68" height="12" rx="4" fill="url(#arrow-red-bevel)" opacity="0.8"/>
    <ellipse cx="128" cy="48" rx="30" ry="4" fill="#FFE4E6" opacity="0.7"/>

    <!-- Left & Right Wing Rim Highlights -->
    <path d="M 48 140 L 128 220 L 138 210 L 64 136 Z" fill="#FFE4E6" opacity="0.5"/>

    <!-- Specular Highlight Line down center -->
    <path d="M 128 54 L 128 214" stroke="url(#specular-line-red)" stroke-width="4.5" stroke-linecap="round" opacity="0.45"/>

    <!-- Subtle White Shimmer Dots -->
    <circle cx="128" cy="204" r="4" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="128" cy="176" r="3" fill="#FFFFFF" opacity="0.6"/>
  </g>
</svg>