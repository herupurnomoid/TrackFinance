<svg viewBox="0 0 256 256" width="256" height="256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <filter id="shadow-main" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
    <filter id="shadow-soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <filter id="shadow-sharp" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="blur-ground" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <linearGradient id="phone-case" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="phone-screen" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="bubble-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
  </defs>
  <ellipse cx="128" cy="226" rx="76" ry="14" fill="#0F172A" opacity="0.22" filter="url(#blur-ground)"/>
  
  <g filter="url(#shadow-main)" transform="rotate(-6 128 128)">
    <!-- Smartphone Body -->
    <rect x="74" y="44" width="108" height="172" rx="24" fill="url(#phone-case)"/>
    <!-- Glass Rim Highlight -->
    <rect x="77" y="47" width="102" height="166" rx="21" fill="none" stroke="#64748B" stroke-width="2"/>
    
    <!-- Screen -->
    <rect x="82" y="56" width="92" height="148" rx="16" fill="url(#phone-screen)"/>
    <!-- Speaker & Notch -->
    <rect x="114" y="50" width="28" height="4" rx="2" fill="#334155"/>
    <circle cx="106" cy="52" r="2.5" fill="#334155"/>
    
    <!-- Floating 3D Call Bubble Badge -->
    <g filter="url(#shadow-soft)">
      <circle cx="128" cy="120" r="30" fill="url(#bubble-green)"/>
      <ellipse cx="122" cy="108" rx="12" ry="6" fill="#FFFFFF" opacity="0.7"/>
      <!-- White Handset Path inside Bubble -->
      <path d="M120,110 C120,110 124,114 124,117 C124,120 121,122 121,124 C122,126 126,130 129,131 C131,131 133,128 136,128 C139,128 143,132 143,132 C143,132 145,134 144,136 C143,139 139,142 135,142 C129,142 120,135 116,128 C112,121 112,116 116,113 C118,111 120,110 120,110 Z" fill="#FFFFFF"/>
    </g>
    
    <!-- Bottom Home Bar -->
    <rect x="110" y="196" width="36" height="4" rx="2" fill="#E2E8F0" opacity="0.8"/>
  </g>
</svg>