<svg viewBox="0 0 256 256" width="256" height="256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <filter id="shadow-main" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
    <filter id="shadow-soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <filter id="shadow-sharp" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="blur-ground" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <linearGradient id="bun-top" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="bun-bottom" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="patty" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>
    <linearGradient id="cheese" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <linearGradient id="lettuce" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="cup-grad" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="60%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#9F1239"/>
    </linearGradient>
    <linearGradient id="cup-lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="straw" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
  </defs>
  
  <ellipse cx="128" cy="230" rx="85" ry="14" fill="#0F172A" opacity="0.22" filter="url(#blur-ground)"/>

  <!-- SODA CUP (Right / Back) -->
  <g filter="url(#shadow-main)">
    <!-- Straw -->
    <path d="M178 52 L196 28 L206 33 L190 56 Z" fill="url(#straw)"/>
    <path d="M178 52 L172 90 L162 90 L168 52 Z" fill="#EAB308"/>
    <!-- Lid -->
    <ellipse cx="172" cy="92" rx="34" ry="12" fill="url(#cup-lid)"/>
    <ellipse cx="172" cy="89" rx="28" ry="9" fill="#F8FAFC"/>
    <!-- Cup Body -->
    <path d="M142 96 L150 195 C151 202 157 207 165 207 L179 207 C187 207 193 202 194 195 L202 96 Z" fill="url(#cup-grad)"/>
    <!-- Specular Highlight on cup -->
    <path d="M152 105 L158 190 C158 193 161 195 164 195 L164 105 Z" fill="#FFFFFF" opacity="0.35"/>
  </g>

  <!-- BURGER (Front / Left) -->
  <g filter="url(#shadow-main)">
    <!-- Bottom Bun -->
    <path d="M46 182 C46 174 54 168 64 168 L142 168 C152 168 160 174 160 182 C160 196 142 208 103 208 C64 208 46 196 46 182 Z" fill="url(#bun-bottom)"/>
    <!-- Meat Patty -->
    <rect x="42" y="152" width="122" height="20" rx="10" fill="url(#patty)"/>
    <!-- Cheese layer with drips -->
    <path d="M48 152 L158 152 L154 162 L132 176 L118 158 L92 174 L78 154 L52 166 Z" fill="url(#cheese)" filter="url(#shadow-sharp)"/>
    <!-- Lettuce frills -->
    <path d="M44 144 C48 138 56 140 60 146 C64 140 72 138 78 144 C84 138 94 140 98 146 C104 138 114 138 120 144 C126 138 136 140 142 146 C148 140 158 142 162 148 L158 154 L48 154 Z" fill="url(#lettuce)"/>
    <!-- Top Bun Dome -->
    <path d="M44 140 C44 96 70 82 103 82 C136 82 162 96 162 140 Z" fill="url(#bun-top)"/>
    <!-- Specular highlight curve on bun -->
    <ellipse cx="86" cy="98" rx="28" ry="10" fill="#FFFFFF" opacity="0.45" transform="rotate(-15 86 98)"/>
    <!-- Sesame seeds -->
    <ellipse cx="78" cy="116" rx="3.5" ry="2" fill="#FEF08A" transform="rotate(25 78 116)"/>
    <ellipse cx="98" cy="108" rx="3.5" ry="2" fill="#FEF08A" transform="rotate(-10 98 108)"/>
    <ellipse cx="120" cy="114" rx="3.5" ry="2" fill="#FEF08A" transform="rotate(20 120 114)"/>
    <ellipse cx="92" cy="126" rx="3.5" ry="2" fill="#FEF08A" transform="rotate(-25 92 126)"/>
    <ellipse cx="112" cy="126" rx="3.5" ry="2" fill="#FEF08A" transform="rotate(15 112 126)"/>
    <ellipse cx="134" cy="122" rx="3.5" ry="2" fill="#FEF08A" transform="rotate(-15 134 122)"/>
  </g>
</svg>
