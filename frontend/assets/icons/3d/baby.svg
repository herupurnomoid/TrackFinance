<svg viewBox="0 0 256 256" width="256" height="256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <filter id="shadow-main" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
    <filter id="shadow-soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <filter id="shadow-sharp" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="blur-ground" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <linearGradient id="pacifier-shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <radialGradient id="nipple-silicone" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </radialGradient>
    <linearGradient id="ring-yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
  </defs>
  <ellipse cx="128" cy="226" rx="74" ry="14" fill="#0F172A" opacity="0.22" filter="url(#blur-ground)"/>
  
  <g filter="url(#shadow-main)">
    <!-- 3D Golden Nipple at Back -->
    <circle cx="128" cy="80" r="34" fill="url(#nipple-silicone)"/>
    <ellipse cx="120" cy="70" rx="12" ry="6" fill="#FFFFFF" opacity="0.75"/>
    
    <!-- Cyan Curved Butterfly Shield -->
    <g filter="url(#shadow-soft)">
      <path d="M80,124 C64,106 68,86 92,98 C108,106 120,116 128,116 C136,116 148,106 164,98 C188,86 192,106 176,124 C162,138 144,142 128,142 C112,142 94,138 80,124 Z" fill="url(#pacifier-shield)"/>
      <ellipse cx="128" cy="120" rx="36" ry="8" fill="#FFFFFF" opacity="0.45"/>
    </g>
    
    <!-- Central Fastener Knob -->
    <circle cx="128" cy="132" r="18" fill="#FFFFFF" filter="url(#shadow-sharp)"/>
    
    <!-- Hanging Ring Grip -->
    <path d="M106,144 C106,180 150,180 150,144" fill="none" stroke="url(#ring-yellow)" stroke-width="14" stroke-linecap="round" filter="url(#shadow-soft)"/>
  </g>
</svg>