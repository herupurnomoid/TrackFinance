flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/app_logo.png"
  image_path_ios: "assets/icons/app_logo_ios.png"
  adaptive_icon_background: "assets/icons/app_logo_background.png"
  adaptive_icon_foreground: "assets/icons/app_logo_foreground.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icons/app_logo.png"
    background_color: "#1E3A8A"
    theme_color: "#2563EB"
  macos:
    generate: true
    image_path: "assets/icons/app_logo.png"
  windows:
    generate: true
    image_path: "assets/icons/app_logo.png"
    icon_size: 48
